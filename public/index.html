<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>SSE Logs — Full Replay</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <style>
    body { font-family: system-ui, sans-serif; margin: 1rem; }
    #feed { background: #111; color: #eee; padding: 1rem; border-radius: 6px; height: 60vh; overflow: auto; }
    .row { margin: .25rem 0; white-space: pre; }
    .debug { color: #7aa; }
    .info  { color: #adf; }
    .warn  { color: #fd6; }
    .error { color: #f88; }
    .system { color: #999; font-style: italic; }
    label, select, button { margin-right: .5rem; }
    #status.connected    { color: green;    }
    #status.reconnecting { color: orange;   }
    #status.disconnected { color: red;      }
  </style>
</head>
<body>
  <h1>SSE Logs — Full Replay Demo</h1>
  <div>
    <label>Min level:
      <select id="level">
        <option>debug</option>
        <option selected>info</option>
        <option>warn</option>
        <option>error</option>
      </select>
    </label>
    <button id="connect">Connect</button>
    <button id="disconnect">Disconnect</button>
    <span id="status" class="disconnected">disconnected</span>
    <span id="lastId">Last ID: none</span>
  </div>
  <div id="feed" aria-live="polite"></div>
  <script>
    const feed      = document.getElementById('feed');
    const statusEl  = document.getElementById('status');
    const levelEl   = document.getElementById('level');
    const lastIdEl  = document.getElementById('lastId');
    let es = null, lastEventId = null;

    function logLine(msg, cls) {
      const d = document.createElement('div');
      d.className = 'row ' + cls;
      d.textContent = msg;
      feed.appendChild(d);
      feed.scrollTop = feed.scrollHeight;
    }

    function setStatus(text, cls) {
      statusEl.textContent = text;
      statusEl.className = cls;
    }

    function connect() {
      if (es) es.close();
      const lvl = levelEl.value;
      es = new EventSource(`/logs?level=${encodeURIComponent(lvl)}`);
      setStatus('connecting…', 'reconnecting');
      logLine('→ Opening SSE connection…','system');

      es.onopen = () => {
        setStatus('connected','connected');
        logLine('✓ Connected','system');
      };

      es.onmessage = (e) => {
        try {
          const rec = JSON.parse(e.data);
          const time = new Date(rec.ts).toLocaleTimeString();
          logLine(`${time} [${rec.level}] ${rec.msg}`, rec.level);
          if (e.lastEventId) {
            lastEventId = e.lastEventId;
            lastIdEl.textContent = `Last ID: ${lastEventId}`;
          }
        } catch (err) {
          logLine(`⚠ Parse error: ${err.message}`,'system');
        }
      };

      es.onerror = () => {
        setStatus('reconnecting…','reconnecting');
        logLine('⚠ Connection lost, retrying…','system');
      };
    }

    function disconnect() {
      if (es) {
        es.close();
        es = null;
        setStatus('disconnected','disconnected');
        logLine(`✕ Disconnected (Last ID: ${lastEventId})`,'system');
      }
    }

    document.getElementById('connect').onclick    = connect;
    document.getElementById('disconnect').onclick = disconnect;


    connect();
  </script>
</body>
</html>
