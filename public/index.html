<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>SSE — Live Logs</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 2rem; }
      #feed { background: #111; color: #eee; padding: 1rem; border-radius: 8px; max-height: 60vh; overflow: auto; }
      .row { margin: .25rem 0; white-space: pre; }
      .debug { color: #7aa; } .info { color: #adf; } .warn { color: #fd6; } .error { color: #f88; }
      label, select, button { margin-right: .5rem; }
    </style>
  </head>
  <body>
    <h1>Server‑Sent Events — Live Logs</h1>

    <div>
      <label for="level">Minimum level:</label>
      <select id="level">
        <option>debug</option>
        <option selected>info</option>
        <option>warn</option>
        <option>error</option>
      </select>
      <button id="connect">Connect</button>
      <button id="disconnect">Disconnect</button>
      <span id="status">disconnected</span>
    </div>

    <div id="feed" aria-live="polite"></div>

    <script>
      const feed = document.getElementById('feed');
      const statusEl = document.getElementById('status');
      const levelEl = document.getElementById('level');
      const connectBtn = document.getElementById('connect');
      const disconnectBtn = document.getElementById('disconnect');

      let es = null; // EventSource instance

      function logLine(rec) {
        const div = document.createElement('div');
        div.className = `row ${rec.level}`;
        const time = new Date(rec.ts).toLocaleTimeString();
        div.textContent = `${time} [${rec.level}] ${rec.msg}`;
        feed.appendChild(div);
        feed.scrollTop = feed.scrollHeight;
      }

      function connect() {
        if (es) es.close();
        const lvl = levelEl.value;
        // Same-origin endpoint; no CORS required
        es = new EventSource(`/logs?level=${encodeURIComponent(lvl)}`);
        statusEl.textContent = 'connecting…';

        es.onopen = () => {
          statusEl.textContent = 'connected';
        };

        es.onmessage = (e) => {
          try {
            const rec = JSON.parse(e.data);
            logLine(rec);
          } catch (err) {
            console.error('Bad JSON from stream', err);
          }
        };

        es.onerror = () => {
          // Browser auto-reconnects; show transient status
          statusEl.textContent = 'reconnecting…';
        };
      }

      function disconnect() {
        if (es) {
          es.close();
          es = null;
          statusEl.textContent = 'disconnected';
        }
      }

      connectBtn.addEventListener('click', connect);
      disconnectBtn.addEventListener('click', disconnect);

      // Auto-connect on load
      connect();
    </script>
  </body>
</html>
